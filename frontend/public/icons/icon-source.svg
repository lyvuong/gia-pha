<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A1A27"/>
      <stop offset="100%" stop-color="#5C121E"/>
    </linearGradient>
  </defs>

  <!-- Background: full bleed, opaque (required for iOS icons) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- Family tree: root -> 2 children -> 4 grandchildren -->
  <g stroke="#DEB25F" stroke-width="20" stroke-linecap="round" fill="none">
    <!-- root to gen2 -->
    <line x1="512" y1="722" x2="362" y2="552"/>
    <line x1="512" y1="722" x2="662" y2="552"/>
    <!-- gen2 to gen3 -->
    <line x1="362" y1="552" x2="282" y2="382"/>
    <line x1="362" y1="552" x2="432" y2="382"/>
    <line x1="662" y1="552" x2="592" y2="382"/>
    <line x1="662" y1="552" x2="732" y2="382"/>
  </g>

  <g fill="#F0CD82">
    <!-- root node (generation 1 / ancestor) -->
    <circle cx="512" cy="722" r="60"/>
    <!-- generation 2 nodes -->
    <circle cx="362" cy="552" r="46"/>
    <circle cx="662" cy="552" r="46"/>
    <!-- generation 3 nodes -->
    <circle cx="282" cy="382" r="34"/>
    <circle cx="432" cy="382" r="34"/>
    <circle cx="592" cy="382" r="34"/>
    <circle cx="732" cy="382" r="34"/>
  </g>
</svg>
