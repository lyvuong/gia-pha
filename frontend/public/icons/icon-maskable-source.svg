<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A1A27"/>
      <stop offset="100%" stop-color="#5C121E"/>
    </linearGradient>
  </defs>

  <!-- Background: full bleed, opaque -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- Same tree, scaled down ~62% and kept centered so an adaptive-icon mask
       (circle, squircle, rounded square, etc.) never clips the design -->
  <g stroke="#DEB25F" stroke-width="12.4" stroke-linecap="round" fill="none">
    <line x1="512" y1="642" x2="419" y2="537"/>
    <line x1="512" y1="642" x2="605" y2="537"/>
    <line x1="419" y1="537" x2="369" y2="431"/>
    <line x1="419" y1="537" x2="462" y2="431"/>
    <line x1="605" y1="537" x2="562" y2="431"/>
    <line x1="605" y1="537" x2="655" y2="431"/>
  </g>

  <g fill="#F0CD82">
    <circle cx="512" cy="642" r="37"/>
    <circle cx="419" cy="537" r="29"/>
    <circle cx="605" cy="537" r="29"/>
    <circle cx="369" cy="431" r="21"/>
    <circle cx="462" cy="431" r="21"/>
    <circle cx="562" cy="431" r="21"/>
    <circle cx="655" cy="431" r="21"/>
  </g>
</svg>
