name = "gia-pha"
compatibility_date = "2026-09-15"
main = "src/worker.js"

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Page routes go through src/worker.js so it can localize the link-preview tags; built files skip it.
run_worker_first = ["/*", "!/assets/*", "!/icons/*", "!/*.js", "!/*.json", "!/*.png", "!/*.webmanifest"]

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
APP_ORIGIN = "https://gia-pha.<your-subdomain>.workers.dev"
